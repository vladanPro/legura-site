name: Site CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install pinned Axonyx CLI
        run: cargo install cargo-axonyx --version 0.8.8 --locked
      - name: Check site
        run: cargo ax check
      - name: Check project health
        run: cargo ax doctor --deny-warnings
      - name: Build static site
        run: cargo ax build --clean
      - name: Verify public pages and assets
        run: |
          test -s dist/index.html
          test -s dist/how-it-works/index.html
          test -s dist/roadmap/index.html
          test -s dist/download/index.html
          test -s dist/css/legura-site.css
          test -s dist/brand-mark.svg
          grep -q 'Legura' dist/index.html
          grep -Fq 'experimental 0.0.2 pilot' dist/download/index.html
          for asset in legura-0.0.2-x86_64-pc-windows-msvc.zip legura-0.0.2-x86_64-unknown-linux-gnu.tar.gz; do
            grep -Fq "/releases/download/v0.0.2-pilot.1/$asset\"" dist/download/index.html
            grep -Fq "/releases/download/v0.0.2-pilot.1/$asset.sha256\"" dist/download/index.html
          done
          grep -Fq '/archive/refs/tags/v0.0.2-pilot.1.zip"' dist/download/index.html
          grep -Fq 'Build from the extracted ZIP' dist/download/index.html
