name: Site CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install pinned Axonyx CLI
        run: cargo install cargo-axonyx --version 0.8.8 --locked
      - name: Check site
        run: cargo ax check
      - name: Check project health
        run: cargo ax doctor --deny-warnings
      - name: Build static site
        run: cargo ax build --clean
      - name: Verify public pages and assets
        run: |
          test -s dist/index.html
          test -s dist/how-it-works/index.html
          test -s dist/roadmap/index.html
          test -s dist/download/index.html
          test -s dist/css/legura-site.css
          test -s dist/brand-mark.svg
          grep -q 'Legura' dist/index.html
          pilot=0.0.5
          tag="v${pilot}-pilot.1"
          grep -Fq "experimental $pilot pilot" dist/download/index.html
          if grep -Eq 'v0\.0\.[234]-pilot\.1|legura-0\.0\.[234]-' dist/download/index.html; then
            echo 'Download page still contains a previous pilot version'
            exit 1
          fi
          for asset in "legura-$pilot-x86_64-pc-windows-msvc.zip" "legura-$pilot-x86_64-unknown-linux-gnu.tar.gz"; do
            grep -Fq "/releases/download/$tag/$asset\"" dist/download/index.html
            grep -Fq "/releases/download/$tag/$asset.sha256\"" dist/download/index.html
          done
          grep -Fq "/archive/refs/tags/$tag.zip\"" dist/download/index.html
          grep -Fq "/releases/tag/$tag\"" dist/download/index.html
          grep -Fq '0.8.10' dist/download/index.html
          grep -Fq 'id="upgrade-title"' dist/download/index.html
          grep -Fq 'Do not repeat the fresh-install commands' dist/download/index.html
          grep -Fq "/blob/$tag/docs/native-package-v0.md#schema-changes-isolated-rehearsal\"" dist/download/index.html
          grep -Fq 'Migration 021 preserves' dist/download/index.html
          grep -Fq "Available in $pilot pilot" dist/roadmap/index.html
          grep -Fq 'Preview and activate Classic, Alloy or Legura' dist/index.html
          grep -Fq 'Build from the extracted ZIP' dist/download/index.html
          grep -Fq 'Run on Windows (PowerShell)' dist/download/index.html
          grep -Fq 'Run on Linux (shell)' dist/download/index.html
          grep -Fq 'Create your first administrator.' dist/download/index.html
